# Automatische Tests bei jedem Push und Pull Request:
# 1) Syntax aller JavaScript-Module, 2) Browser-Rauchtest
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tests/syntax.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright installieren
        run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Webserver starten
        run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2 && curl -sf http://localhost:8765/ >/dev/null
      - name: Rauchtest
        run: node tests/smoke.mjs
